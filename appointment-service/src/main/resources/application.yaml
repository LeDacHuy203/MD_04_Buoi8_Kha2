server:
  port: 8083

spring:
  application:
    name: appointment-service

resilience4j:
  circuitbreaker:
    instances:
      doctorServiceCB:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3

logging:
  level:
    io:
      github:
        resilience4j: DEBUG


